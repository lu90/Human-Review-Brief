name: HRB deterministic contract validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deterministic HRB contracts and fixtures
        run: ruby scripts/validate_contracts.rb
